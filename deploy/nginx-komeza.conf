server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name nile.co.rw;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nile.co.rw;

    root /var/www/komeza;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/nile.co.rw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nile.co.rw/privkey.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
